services:
  # ----------------------------------------------------------------------------
  # MySQL Database Service (Default initial baseline)
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0.36
    container_name: pavena-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_password
      MYSQL_DATABASE: pavena_db
      MYSQL_USER: pavena_user
      MYSQL_PASSWORD: pavena_secure_password
    ports:
      - "3306:3306"
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_dev_password"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service (Target production migration provider)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: pavena-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pavena_db
      POSTGRES_USER: pavena_user
      POSTGRES_PASSWORD: pavena_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pavena_user -d pavena_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------------------------
  # MinIO S3-Compatible Object Storage Service
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: pavena-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: pavena_minio_admin
      MINIO_ROOT_PASSWORD: pavena_minio_secret_key
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  postgres_data:
  minio_data:
