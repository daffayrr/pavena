services:
  mysql:
    image: mysql:8.0.36
    container_name: pavena-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_password
      MYSQL_DATABASE: pavena_db
      MYSQL_USER: pavena_user
      MYSQL_PASSWORD: pavena_secure_password
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: pavena-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: pavena_minio_admin
      MINIO_ROOT_PASSWORD: pavena_minio_secret_key
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  mysql_data:
  minio_data:
